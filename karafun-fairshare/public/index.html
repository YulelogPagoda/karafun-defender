<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Karaoke — fair-share queue</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    font-family: system-ui, -apple-system, sans-serif;
    margin: 0; padding: 1.25rem;
    background: #14121a; color: #ece8f5; max-width: 32rem; margin: 0 auto;
  }
  h1 { font-size: 1.3rem; margin: 0 0 .25rem; }
  .sub { color: #9a93b0; font-size: .85rem; margin: 0 0 1.25rem; }
  input, button {
    font: inherit; padding: .7rem .8rem; border-radius: .6rem; border: 1px solid #3a3550;
  }
  input { width: 100%; background: #1f1b2b; color: inherit; margin-bottom: .6rem; }
  button {
    background: #6c4cff; color: #fff; border-color: #6c4cff; cursor: pointer; width: 100%;
  }
  button:disabled { opacity: .5; cursor: default; }
  .card { background: #1c1828; border: 1px solid #2c2740; border-radius: .9rem; padding: 1rem; margin-bottom: 1rem; }
  .standing { text-align: center; }
  .pos { font-size: 2.6rem; font-weight: 700; line-height: 1; }
  .muted { color: #9a93b0; font-size: .85rem; }
  ul { list-style: none; padding: 0; margin: .5rem 0 0; }
  li { padding: .4rem .6rem; background: #211c30; border-radius: .5rem; margin-bottom: .35rem; font-size: .9rem; }
  .badge { display:inline-block; font-size:.7rem; padding:.15rem .5rem; border-radius:1rem; background:#3a3550; color:#cfc8e6; }
  .hidden { display: none; }
</style>
</head>
<body>
  <h1>🎤 Fair-share karaoke</h1>
  <p class="sub">Whoever has sung least goes next. <span id="mode" class="badge">connecting…</span></p>

  <!-- join -->
  <div id="join" class="card">
    <label class="muted" for="name">Your name</label>
    <input id="name" placeholder="e.g. Sam" autocomplete="off" />
    <button id="joinBtn">Join the queue</button>
  </div>

  <!-- main -->
  <div id="main" class="hidden">
    <div class="card standing">
      <div class="muted">Your position</div>
      <div class="pos" id="pos">—</div>
      <div class="muted" id="ahead"></div>
    </div>

    <div class="card">
      <label class="muted" for="title">Add a song</label>
      <input id="title" placeholder="song or artist" autocomplete="off" />
      <button id="addBtn">Add to queue</button>
      <ul id="yours"></ul>
    </div>
  </div>

<script>
(() => {
  // --- device fingerprint (localStorage; forgeable — fine for a party) ------
  const FP_KEY = 'karafun-fp';
  let fp = localStorage.getItem(FP_KEY);
  if (!fp) {
    fp = (crypto.randomUUID ? crypto.randomUUID()
          : Date.now().toString(36) + Math.random().toString(36).slice(2));
    localStorage.setItem(FP_KEY, fp);
  }
  const savedName = localStorage.getItem('karafun-name') || '';
  const $ = (id) => document.getElementById(id);
  $('name').value = savedName;

  // Passive browser fingerprint — an extra correlation signal so a guest who
  // clears storage is still recognizable as the same device. Non-cryptographic
  // hash (cyrb53) so it works on a plain-HTTP LAN (crypto.subtle needs https).
  function cyrb53(str, seed = 0) {
    let h1 = 0xdeadbeef ^ seed, h2 = 0x41c6ce57 ^ seed;
    for (let i = 0; i < str.length; i++) {
      const ch = str.charCodeAt(i);
      h1 = Math.imul(h1 ^ ch, 2654435761);
      h2 = Math.imul(h2 ^ ch, 1597334677);
    }
    h1 = Math.imul(h1 ^ (h1 >>> 16), 2246822507); h1 ^= Math.imul(h2 ^ (h2 >>> 13), 3266489909);
    h2 = Math.imul(h2 ^ (h2 >>> 16), 2246822507); h2 ^= Math.imul(h1 ^ (h1 >>> 13), 3266489909);
    return (4294967296 * (2097151 & h2) + (h1 >>> 0)).toString(16);
  }
  function canvasSig() {
    try {
      const c = document.createElement('canvas');
      const x = c.getContext('2d');
      x.textBaseline = 'top'; x.font = '14px Arial';
      x.fillStyle = '#069'; x.fillText('kf-fp-\u{1F3A4}', 2, 2);
      x.fillStyle = 'rgba(102,200,0,0.7)'; x.fillText('kf-fp-\u{1F3A4}', 4, 4);
      return c.toDataURL();
    } catch (_) { return 'nocanvas'; }
  }
  function webglSig() {
    try {
      const gl = document.createElement('canvas').getContext('webgl');
      const dbg = gl.getExtension('WEBGL_debug_renderer_info');
      return dbg ? gl.getParameter(dbg.UNMASKED_RENDERER_WEBGL) : (gl.getParameter(gl.RENDERER) || '');
    } catch (_) { return 'nowebgl'; }
  }
  const BFP = (() => {
    try {
      return cyrb53([
        navigator.userAgent, navigator.language, (navigator.languages || []).join(','),
        screen.width + 'x' + screen.height + 'x' + screen.colorDepth,
        new Date().getTimezoneOffset(), navigator.hardwareConcurrency || '',
        navigator.deviceMemory || '', navigator.maxTouchPoints || '',
        canvasSig(), webglSig(),
      ].join('|'));
    } catch (_) { return ''; }
  })();

  // --- websocket ------------------------------------------------------------
  const proto = location.protocol === 'https:' ? 'wss' : 'ws';
  let ws, joined = false;

  function connect() {
    ws = new WebSocket(`${proto}://${location.host}`);
    ws.onopen = () => { $('mode').textContent = 'connected'; if (joined) doJoin(); };
    ws.onclose = () => { $('mode').textContent = 'reconnecting…'; setTimeout(connect, 1500); };
    ws.onmessage = (ev) => handle(JSON.parse(ev.data));
  }

  function sendMsg(obj) { if (ws && ws.readyState === 1) ws.send(JSON.stringify(obj)); }

  function doJoin() {
    const name = $('name').value.trim() || 'guest';
    localStorage.setItem('karafun-name', name);
    sendMsg({ type: 'join', fp, name, bfp: BFP });
  }

  function handle(msg) {
    switch (msg.type) {
      case 'joined':
        joined = true;
        $('join').classList.add('hidden');
        $('main').classList.remove('hidden');
        $('mode').textContent = msg.observe ? 'observe mode' : 'live';
        break;
      case 'standing':
        $('pos').textContent = msg.position == null ? '—' : `#${msg.position}`;
        $('ahead').textContent = msg.position == null
          ? 'no songs queued'
          : `${msg.ahead} ahead · ${msg.queueLength} in queue · sung ${msg.played}×`;
        $('yours').innerHTML = (msg.yours || [])
          .map((y) => `<li>${escapeHtml(y.title)}</li>`).join('');
        break;
      case 'added':
        $('title').value = '';
        break;
      case 'error':
        console.warn('server error:', msg.error);
        break;
    }
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, (c) =>
      ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
  }

  // --- UI -------------------------------------------------------------------
  $('joinBtn').onclick = () => { joined = true; doJoin(); };
  $('addBtn').onclick = () => {
    const title = $('title').value.trim();
    if (title) sendMsg({ type: 'add', title });
  };
  $('title').addEventListener('keydown', (e) => { if (e.key === 'Enter') $('addBtn').click(); });
  $('name').addEventListener('keydown', (e) => { if (e.key === 'Enter') $('joinBtn').click(); });

  connect();
})();
</script>
</body>
</html>
